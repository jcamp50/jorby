name: web

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        env:
          FOUNDRY_TOKEN: ${{ secrets.FOUNDRY_TOKEN }}
      - run: npm run lint
      - run: npm run test
      - run: npm run build
